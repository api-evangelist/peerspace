name: Peerspace
description: 'Peerspace is an online marketplace for booking unique venues and spaces
  by the hour — event spaces, meeting rooms, photo and film studios, production locations,
  and unconventional rooms and residences — connecting space owners (hosts) with people
  who need distinctive locations for events, meetings, photo shoots, and productions.
  Surfaced as a portfolio company of gv and added to the API Evangelist network. Peerspace
  operates a consumer marketplace with web and mobile apps but does not publish a public
  developer API; this profile captures its public identity, security posture, and legal
  and support surface.'
